name: CI

on:
  push:
    branches: ["main", "opensource-foundation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libreoffice-writer libreoffice-calc libreoffice-impress tesseract-ocr tesseract-ocr-eng icc-profiles-free
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: python -m pytest -q

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend scripts
        shell: bash
        run: |
          shopt -s nullglob
          files=(static/*.js)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
